name: BSWD L&L Studio metadata pilot

on:
  push:
    branches:
      - bswd-ll-metadata-pilot-20261020
    paths:
      - ".github/workflows/bswd-ll-metadata-pilot.yml"
      - "studio/bswd_metadata_pilot.py"
      - "studio/bswd-pilot-manifest.json"

permissions:
  contents: write

jobs:
  guarded-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4
        with:
          ref: bswd-ll-metadata-pilot-20261020
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install metadata and image validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Run guarded metadata pilot
        run: |
          python studio/bswd_metadata_pilot.py \
            --manifest studio/bswd-pilot-manifest.json \
            --report studio/bswd-pilot-results.json

      - name: Verify only pilot assets changed
        run: |
          git diff --check
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest=json.loads(Path("studio/bswd-pilot-manifest.json").read_text())
          report=json.loads(Path("studio/bswd-pilot-results.json").read_text())
          allowed={row["path"] for row in manifest["files"]}|{"studio/bswd-pilot-results.json"}
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          assert changed.issubset(allowed), f"Unexpected changed paths: {sorted(changed-allowed)}"
          assert set(report["updated_paths"]).issubset(changed)
          assert report["live_site_code_changed"] is False
          print("Guarded pilot verified:", len(report["updated_paths"]), "metadata-only edits")
          PY

      - name: Render before and after visual-review sheets
        run: |
          python - <<'PY'
          import io, json, subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root=Path.cwd()
          report=json.loads(Path("studio/bswd-pilot-results.json").read_text())
          out=root/"studio-review"
          out.mkdir(exist_ok=True)
          index=[]

          def display_image(raw):
              im=Image.open(io.BytesIO(raw))
              im.seek(0)
              im=im.convert("RGBA")
              max_w,max_h=1100,900
              scale=min(max_w/im.width,max_h/im.height,1.0)
              if scale<1:
                  im=im.resize((max(1,int(im.width*scale)),max(1,int(im.height*scale))),Image.Resampling.LANCZOS)
              bg=Image.new("RGBA",im.size,(230,230,230,255))
              tile=20
              d=ImageDraw.Draw(bg)
              for y in range(0,im.height,tile):
                  for x in range(0,im.width,tile):
                      if (x//tile+y//tile)%2:
                          d.rectangle((x,y,min(x+tile,im.width),min(y+tile,im.height)),fill=(200,200,200,255))
              bg.alpha_composite(im)
              return bg.convert("RGB")

          for row in report["files"]:
              path=row["path"]
              if row["status"]!="verified_metadata_only":
                  continue
              original=subprocess.check_output(["git","show",f"origin/main:{path}"])
              staged=(root/path).read_bytes()
              a=display_image(original)
              b=display_image(staged)
              w=max(a.width,b.width)
              header=72
              gap=24
              canvas=Image.new("RGB",(w*2+gap,max(a.height,b.height)+header),"white")
              canvas.paste(a,(0,header))
              canvas.paste(b,(w+gap,header))
              draw=ImageDraw.Draw(canvas)
              draw.text((12,12),"ORIGINAL main",fill="black")
              draw.text((w+gap+12,12),"STAGED metadata-only",fill="black")
              draw.text((12,38),path,fill="black")
              safe=path.replace("/","__").replace("\\","__")
              target=out/f"{safe}.png"
              canvas.save(target,"PNG")
              index.append({"path":path,"review_image":target.name})
          (out/"index.json").write_text(json.dumps(index,indent=2)+"\n")
          print("Rendered",len(index),"visual-review sheets")
          PY

      - name: Upload visual-review artifact
        uses: actions/upload-artifact@v4
        with:
          name: bswd-metadata-pilot-visual-review
          path: studio-review/
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified metadata-only edits to pilot branch
        run: |
          git config user.name "L&L Studio Metadata Bot"
          git config user.email "actions@users.noreply.github.com"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          report=json.loads(Path("studio/bswd-pilot-results.json").read_text())
          paths=report["updated_paths"]+["studio/bswd-pilot-results.json"]
          subprocess.run(["git","add","--",*paths],check=True)
          PY
          if git diff --cached --quiet; then
            echo "No metadata edits needed."
            exit 0
          fi
          git commit -m "stage: BSWD artwork metadata pending visual approval"
          git push origin HEAD:bswd-ll-metadata-pilot-20261020
