name: BSWD legacy concept provenance batch 01

on:
  push:
    branches:
      - bswd-legacy-provenance-batch01-20261020
    paths:
      - ".github/workflows/bswd-legacy-concept-batch01.yml"
      - "studio/bswd_legacy_concept_batch01.py"
      - "studio/bswd-legacy-concept-batch01.json"

permissions:
  contents: write

jobs:
  guarded-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          ref: bswd-legacy-provenance-batch01-20261020
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Run guarded legacy concept batch
        run: |
          python studio/bswd_legacy_concept_batch01.py             --manifest studio/bswd-legacy-concept-batch01.json             --report studio/bswd-legacy-concept-batch01-results.json

      - name: Verify outputs and changed paths
        run: |
          git diff --check
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest=json.loads(Path("studio/bswd-legacy-concept-batch01.json").read_text())
          report=json.loads(Path("studio/bswd-legacy-concept-batch01-results.json").read_text())
          allowed={row["path"] for row in manifest["files"]}|{"studio/bswd-legacy-concept-batch01-results.json"}
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          assert changed.issubset(allowed), f"Unexpected changed paths: {sorted(changed-allowed)}"
          assert set(report["updated_paths"]).issubset(changed)
          assert report["live_site_code_changed"] is False
          for row in report["files"]:
              if row["status"]!="verified":
                  continue
              if row["operation"]=="metadata_only":
                  assert row["pixels_alpha_frames_profile_unchanged"] is True
                  assert row["compressed_picture_data_unchanged"] is True
              elif row["operation"]=="jpeg_bytes_to_true_png":
                  assert row["decoded_rgb_pixels_unchanged"] is True
                  assert row["icc_profile_unchanged"] is True
              else:
                  raise AssertionError(row["operation"])
          print("Guarded legacy concept batch verified:",len(report["updated_paths"]))
          PY

      - name: Render original and staged review sheets
        run: |
          python - <<'PY'
          import io, json, subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw

          root=Path.cwd()
          report=json.loads(Path("studio/bswd-legacy-concept-batch01-results.json").read_text())
          out=root/"studio-review"
          out.mkdir(exist_ok=True)
          index=[]

          def render(raw):
              im=Image.open(io.BytesIO(raw))
              im.seek(0)
              im=im.convert("RGBA")
              max_w,max_h=1000,800
              scale=min(max_w/im.width,max_h/im.height,1.0)
              if scale<1:
                  im=im.resize((max(1,int(im.width*scale)),max(1,int(im.height*scale))),Image.Resampling.LANCZOS)
              bg=Image.new("RGBA",im.size,(230,230,230,255))
              tile=20
              d=ImageDraw.Draw(bg)
              for y in range(0,im.height,tile):
                  for x in range(0,im.width,tile):
                      if (x//tile+y//tile)%2:
                          d.rectangle((x,y,min(x+tile,im.width),min(y+tile,im.height)),fill=(200,200,200,255))
              bg.alpha_composite(im)
              return bg.convert("RGB")

          for row in report["files"]:
              if row["status"]!="verified":
                  continue
              path=row["path"]
              original=subprocess.check_output(["git","show",f"origin/main:{path}"])
              staged=(root/path).read_bytes()
              a=render(original)
              b=render(staged)
              w=max(a.width,b.width)
              h=max(a.height,b.height)
              gap=24
              header=92
              canvas=Image.new("RGB",(w*2+gap,h+header),"white")
              canvas.paste(a,(0,header))
              canvas.paste(b,(w+gap,header))
              draw=ImageDraw.Draw(canvas)
              draw.text((12,10),"ORIGINAL main",fill="black")
              draw.text((w+gap+12,10),"STAGED",fill="black")
              draw.text((12,36),path,fill="black")
              draw.text((12,59),row["project"],fill="black")
              draw.text((w+gap+12,36),row["operation"],fill="black")
              safe=path.replace("/","__").replace("\\","__")
              target=out/f"{safe}.png"
              canvas.save(target,"PNG")
              index.append({"path":path,"project":row["project"],"operation":row["operation"],"review_image":target.name})
          (out/"index.json").write_text(json.dumps(index,indent=2)+"\n")
          print("Rendered",len(index),"visual review sheets")
          PY

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: bswd-legacy-concept-batch01-review
          path: studio-review/
          if-no-files-found: error
          retention-days: 14

      - name: Commit staged changes
        run: |
          git config user.name "L&L Studio Metadata Bot"
          git config user.email "actions@users.noreply.github.com"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          report=json.loads(Path("studio/bswd-legacy-concept-batch01-results.json").read_text())
          paths=report["updated_paths"]+["studio/bswd-legacy-concept-batch01-results.json"]
          subprocess.run(["git","add","--",*paths],check=True)
          PY
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "stage: legacy concept provenance batch one pending visual approval"
          git push origin HEAD:bswd-legacy-provenance-batch01-20261020
