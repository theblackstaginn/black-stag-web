name: BSWD client portfolio metadata batch 01

on:
  push:
    branches:
      - bswd-client-portfolio-meta-batch01-20261020
    paths:
      - ".github/workflows/bswd-client-portfolio-meta-batch01.yml"
      - "studio/bswd_client_portfolio_batch.py"
      - "studio/bswd-client-portfolio-batch01.json"

permissions:
  contents: write

jobs:
  guarded-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          ref: bswd-client-portfolio-meta-batch01-20261020
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Run guarded client portfolio batch
        run: |
          python studio/bswd_client_portfolio_batch.py \
            --manifest studio/bswd-client-portfolio-batch01.json \
            --report studio/bswd-client-portfolio-batch01-results.json

      - name: Verify only approved batch files changed
        run: |
          git diff --check
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest=json.loads(Path("studio/bswd-client-portfolio-batch01.json").read_text())
          report=json.loads(Path("studio/bswd-client-portfolio-batch01-results.json").read_text())
          allowed={row["path"] for row in manifest["files"]}|{"studio/bswd-client-portfolio-batch01-results.json"}
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          assert changed.issubset(allowed), f"Unexpected changed paths: {sorted(changed-allowed)}"
          assert set(report["updated_paths"]).issubset(changed)
          assert report["live_site_code_changed"] is False
          for row in report["files"]:
              if row["status"]=="verified_metadata_only":
                  assert row["pixels_alpha_frames_profile_unchanged"] is True
                  assert row["compressed_picture_data_unchanged"] is True
          print("Guarded client portfolio batch verified:",len(report["updated_paths"]),"metadata-only edits")
          PY

      - name: Render original and staged visual review sheets
        run: |
          python - <<'PY'
          import io, json, subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw

          root=Path.cwd()
          report=json.loads(Path("studio/bswd-client-portfolio-batch01-results.json").read_text())
          out=root/"studio-review"
          out.mkdir(exist_ok=True)
          index=[]

          def display_image(raw):
              im=Image.open(io.BytesIO(raw))
              im.seek(0)
              im=im.convert("RGBA")
              max_w,max_h=1000,800
              scale=min(max_w/im.width,max_h/im.height,1.0)
              if scale<1:
                  im=im.resize((max(1,int(im.width*scale)),max(1,int(im.height*scale))),Image.Resampling.LANCZOS)
              bg=Image.new("RGBA",im.size,(230,230,230,255))
              tile=20
              d=ImageDraw.Draw(bg)
              for y in range(0,im.height,tile):
                  for x in range(0,im.width,tile):
                      if (x//tile+y//tile)%2:
                          d.rectangle((x,y,min(x+tile,im.width),min(y+tile,im.height)),fill=(200,200,200,255))
              bg.alpha_composite(im)
              return bg.convert("RGB")

          for row in report["files"]:
              if row["status"]!="verified_metadata_only":
                  continue
              path=row["path"]
              original=subprocess.check_output(["git","show",f"origin/main:{path}"])
              staged=(root/path).read_bytes()
              a=display_image(original)
              b=display_image(staged)
              w=max(a.width,b.width)
              h=max(a.height,b.height)
              gap=24
              header=86
              canvas=Image.new("RGB",(w*2+gap,h+header),"white")
              canvas.paste(a,(0,header))
              canvas.paste(b,(w+gap,header))
              draw=ImageDraw.Draw(canvas)
              draw.text((12,10),"ORIGINAL main",fill="black")
              draw.text((w+gap+12,10),"STAGED metadata-only",fill="black")
              draw.text((12,38),path,fill="black")
              draw.text((12,60),row["project"],fill="black")
              safe=path.replace("/","__").replace("\\","__")
              target=out/f"{safe}.png"
              canvas.save(target,"PNG")
              index.append({"path":path,"project":row["project"],"review_image":target.name})
          (out/"index.json").write_text(json.dumps(index,indent=2)+"\n")
          print("Rendered",len(index),"visual review sheets")
          PY

      - name: Upload visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: bswd-client-portfolio-batch01-review
          path: studio-review/
          if-no-files-found: error
          retention-days: 14

      - name: Commit staged metadata-only edits
        run: |
          git config user.name "L&L Studio Metadata Bot"
          git config user.email "actions@users.noreply.github.com"
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          report=json.loads(Path("studio/bswd-client-portfolio-batch01-results.json").read_text())
          paths=report["updated_paths"]+["studio/bswd-client-portfolio-batch01-results.json"]
          subprocess.run(["git","add","--",*paths],check=True)
          PY
          if git diff --cached --quiet; then
            echo "No metadata edits needed."
            exit 0
          fi
          git commit -m "stage: client portfolio metadata batch one pending visual approval"
          git push origin HEAD:bswd-client-portfolio-meta-batch01-20261020
