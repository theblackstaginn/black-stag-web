name: BSWD logo format repair

on:
  push:
    branches:
      - bswd-logo-format-repair-20261020
    paths:
      - ".github/workflows/bswd-logo-format-repair.yml"
      - "studio/bswd_logo_format_repair.py"

permissions:
  contents: write

jobs:
  guarded-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: bswd-logo-format-repair-20261020
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image and metadata validators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"

      - name: Run guarded logo repair
        run: python studio/bswd_logo_format_repair.py

      - name: Verify only repair outputs changed
        run: |
          git diff --check
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          report=json.loads(Path("studio/bswd-logo-format-repair.json").read_text())
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          allowed={report["path"],"studio/bswd-logo-format-repair.json"}
          assert changed.issubset(allowed), f"Unexpected changed paths: {sorted(changed-allowed)}"
          assert report["decoded_rgb_pixels_unchanged"] is True
          assert report["icc_profile_unchanged"] is True
          assert report["live_site_code_changed"] is False
          print("Guarded repair verification passed.")
          PY

      - name: Render original and repaired visual comparison
        run: |
          python - <<'PY'
          import io, json, subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw

          report=json.loads(Path("studio/bswd-logo-format-repair.json").read_text())
          path=report["path"]
          original=subprocess.check_output(["git","show",f"origin/main:{path}"])
          repaired=Path(path).read_bytes()

          def render(raw):
              im=Image.open(io.BytesIO(raw)).convert("RGBA")
              max_w,max_h=1200,900
              scale=min(max_w/im.width,max_h/im.height,1.0)
              if scale<1:
                  im=im.resize((max(1,int(im.width*scale)),max(1,int(im.height*scale))),Image.Resampling.LANCZOS)
              bg=Image.new("RGBA",im.size,(230,230,230,255))
              tile=20
              draw=ImageDraw.Draw(bg)
              for y in range(0,im.height,tile):
                  for x in range(0,im.width,tile):
                      if (x//tile+y//tile)%2:
                          draw.rectangle((x,y,min(x+tile,im.width),min(y+tile,im.height)),fill=(200,200,200,255))
              bg.alpha_composite(im)
              return bg.convert("RGB")

          a=render(original)
          b=render(repaired)
          w=max(a.width,b.width)
          h=max(a.height,b.height)
          gap=24
          header=80
          canvas=Image.new("RGB",(w*2+gap,h+header),"white")
          canvas.paste(a,(0,header))
          canvas.paste(b,(w+gap,header))
          draw=ImageDraw.Draw(canvas)
          draw.text((12,12),"ORIGINAL JPEG bytes at .png path",fill="black")
          draw.text((w+gap+12,12),"REPAIRED true PNG",fill="black")
          draw.text((12,42),path,fill="black")
          out=Path("studio-review")
          out.mkdir(exist_ok=True)
          canvas.save(out/"bsw-logo-before-after.png","PNG")
          (out/"report.json").write_text(json.dumps(report,indent=2)+"\n")
          PY

      - name: Upload visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: bswd-logo-format-repair-review
          path: studio-review/
          if-no-files-found: error
          retention-days: 14

      - name: Commit repaired logo to review branch
        run: |
          git config user.name "L&L Studio Metadata Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- stag-studio/bsw-logo.png studio/bswd-logo-format-repair.json
          git commit -m "stage: repair BSWD logo container pending visual approval"
          git push origin HEAD:bswd-logo-format-repair-20261020
